version: 2
updates:
  # Keeps actions/checkout, actions/setup-node on supported majors.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # Group co-dependent packages so peer-dep contracts move as one
    # unit. Without this, Dependabot bumped vite-plugin-svelte to v7
    # (requires vite ^8) while leaving vite at 7.x — landing ERESOLVE
    # on dev (PR #6, reverted 2026-05-11). See workspace memory
    # feedback_dependabot_workflow.
    # The PWA plugin peers on @sveltejs/kit, so it moves with the stack:
    # PR #24 bumped kit to 3 and left @vite-pwa/sveltekit on 1.x (kit ^2).
    groups:
      svelte-stack:
        patterns:
          - "@sveltejs/*"
          - "svelte"
          - "svelte-*"
          - "vite"
          - "@vite-pwa/*"
      tailwind-stack:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
