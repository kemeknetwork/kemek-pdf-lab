name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # `npm ci` is strict about peer-dep resolution and locks to
      # package-lock.json — exactly what we want to catch the case
      # where a Dependabot major bump leaves the lockfile in an
      # ERESOLVE state (e.g. vite-plugin-svelte@7 requires vite@8).
      - run: npm ci

      # static/ serves vendored copies of two engines, and npm never refreshes
      # them. A pdf.js API/worker mismatch kills every PDF in the browser while
      # check/test/build all stay green — so a Dependabot bump that skips the
      # copy must fail HERE. Fix: cp the node_modules file cmp names into static/.
      - name: Vendored engines match installed packages
        run: |
          cmp static/pdf.worker.min.mjs node_modules/pdfjs-dist/build/pdf.worker.min.mjs
          cmp static/qpdf.wasm node_modules/@neslinesli93/qpdf-wasm/dist/qpdf.wasm

      # `check` type-checks with TypeScript 7 through svelte-check's
      # --tsgo-experimental-api mode. While svelte-check calls that mode
      # experimental, the classic TypeScript 6 pass runs as well, so a
      # diagnostic either one finds fails CI. (Plain --tsgo is not an option:
      # measured blind to component prop types, 2026-11-06.)
      - run: npm run check
      - run: npm run check:ts6

      - run: npm test

      - run: npm run build

      # pdf.js reads its image decoders and font data from /pdfjs/<installed
      # version>/, emitted by vite.pdfjs-assets.ts. If they stop shipping, scanned
      # and faxed PDFs render with their images missing while everything above
      # stays green, so check the build output itself.
      - name: pdf.js decoders ship with the build
        run: |
          v=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/pdfjs-dist/package.json','utf8')).version")
          for f in wasm/jbig2.wasm wasm/openjpeg.wasm wasm/qcms_bg.wasm cmaps/Adobe-Japan1-UCS2.bcmap standard_fonts/LiberationSans-Regular.ttf iccs/CGATS001Compat-v2-micro.icc; do
            test -s "build/pdfjs/$v/$f" || { echo "missing build/pdfjs/$v/$f"; exit 1; }
          done
          grep -q "pdfjs/$v/wasm/openjpeg.wasm" build/sw.js || { echo "decoders missing from the SW precache"; exit 1; }

      # The licenses of everything the app ships travel with it in
      # /third-party-notices.txt (vite.third-party-notices.ts). Check the built
      # file names one component from each source the generator reads: the
      # bundle's packages, a virtual module, the qpdf.wasm texts, the fonts.
      - name: Third-party notices ship with the build
        run: |
          f=build/third-party-notices.txt
          test -s "$f" || { echo "missing $f"; exit 1; }
          for want in 'based in part on the work of the Independent JPEG Group' '- pdfjs-dist ' '- svelte ' '- @vite-pwa/workbox-window ' '- qpdf 12.2.0' '- DM Sans (font)'; do
            grep -qF -- "$want" "$f" || { echo "$f lacks: $want"; exit 1; }
          done

      # vite-pwa 2's generateSW accepts runtimeCaching `expiration` and
      # `cacheableResponse`, then emits them as options the strategy ignores, so a
      # cache cap configured that way silently does nothing. The pdfjs-assets
      # HTML filter, cap and full-disk purge are plugin callbacks instead
      # (vite.config.ts); check all three shipped. The keys are quoted when the SW
      # is not minified, and the callback NAMES also occur in the workbox
      # runtime, so match tokens only the callback bodies contain.
      - name: Service worker runtime caches are capped
        run: |
          if grep -qE '"?(expiration|cacheableResponse)"?[[:space:]]*:' build/sw.js; then
            echo "sw.js passes expiration/cacheableResponse as plain options, which the strategy ignores"; exit 1
          fi
          grep -q 'text/html' build/sw.js || { echo "the pdfjs-assets HTML filter is missing from sw.js"; exit 1; }
          grep -qE 'length[[:space:]]*-[[:space:]]*300' build/sw.js || { echo "the pdfjs-assets cap is missing from sw.js"; exit 1; }
          grep -qE 'caches\.delete\(.pdfjs-assets.\)' build/sw.js || { echo "the pdfjs-assets quota purge is missing from sw.js"; exit 1; }
