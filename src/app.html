<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#15803d" />
		<title>Free PDF Editor — Merge, Split & Rotate, No Upload | KeMeK</title>
		<meta name="description" content="Privacy-first PDF manipulation tool — merge, split, reorder, rotate. Runs entirely in your browser, nothing is uploaded." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<link rel="canonical" href="https://pdf.kemek.com/" />

		<!-- Preload the two latin font subsets used on first paint (Bricolage for
		     the brand/titles, DM Sans for body) so they're fetched before app.css
		     applies @font-face — cuts the FOUT/swap on the LCP text. Other unicode
		     subsets load on demand. crossorigin is required even same-origin. -->
		<link rel="preload" href="/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

		<!-- Open Graph / social share. og-image.png is a static 1200×630 card in
		     static/. Absolute URLs (required by Facebook/LinkedIn scrapers) point
		     at the production origin; update the host if the domain changes. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="KeMeK PDF Lab" />
		<meta property="og:title" content="KeMeK PDF Lab — Merge, split &amp; rotate PDFs in your browser" />
		<meta property="og:description" content="Privacy-first PDF manipulation tool — merge, split, reorder, rotate. Runs entirely in your browser, nothing is uploaded." />
		<meta property="og:url" content="https://pdf.kemek.com/" />
		<meta property="og:image" content="https://pdf.kemek.com/og-image.png" />
		<meta property="og:image:secure_url" content="https://pdf.kemek.com/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="KeMeK PDF Lab — merge, split, rotate and watermark PDFs privately in your browser" />
		<meta property="og:locale" content="en_US" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="KeMeK PDF Lab — Merge, split &amp; rotate PDFs in your browser" />
		<meta name="twitter:description" content="Privacy-first PDF manipulation tool — merge, split, reorder, rotate. Runs entirely in your browser, nothing is uploaded." />
		<meta name="twitter:image" content="https://pdf.kemek.com/og-image.png" />
		<meta name="twitter:image:alt" content="KeMeK PDF Lab — merge, split, rotate and watermark PDFs privately in your browser" />

		<!-- Structured data: makes the tool eligible for rich results and legible to
		     AI agents (SoftwareApplication). Mirrors the no-upload / free posture. -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "KeMeK PDF Lab",
				"url": "https://pdf.kemek.com/",
				"applicationCategory": "UtilitiesApplication",
				"operatingSystem": "Any (runs in a web browser)",
				"browserRequirements": "Requires JavaScript and a modern browser",
				"description": "Privacy-first PDF tool — merge, split, reorder, rotate, watermark and number pages entirely in your browser. Files are never uploaded.",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"isAccessibleForFree": true,
				"featureList": [
					"Merge PDFs",
					"Split a PDF into separate files",
					"Reorder, rotate and delete pages",
					"Watermark and page-number stamps",
					"Flatten form fields",
					"Inspect and strip metadata",
					"Extract text and embedded images",
					"Export pages as PNG or JPEG",
					"Open password-protected PDFs"
				],
				"publisher": { "@type": "Organization", "name": "KeMeK Network", "url": "https://kemek.com/" }
			}
		</script>
		%sveltekit.head%
		<script>
			(function() {
				// Blocked site data makes the localStorage getter throw; fall back
				// to the OS preference instead of losing the whole script.
				var t = null;
				try { t = localStorage.getItem('pdf-lab-theme'); } catch (e) {}
				var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) {
					document.documentElement.classList.add('dark');
					document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#06120b');
				}
			})();
		</script>
		<script>
			// crypto.randomUUID() is secure-context-only — undefined when the dev
			// server is reached over plain HTTP on a tailscale IP (insecure origin).
			// pdfjs v6 calls it internally in getDocument(), so without this shim PDF
			// loading throws "crypto.randomUUID is not a function". getRandomValues()
			// IS available on insecure origins, so back the polyfill with it. Must run
			// before pdfjs loads — hence inline in the shell. (Our own ID code keeps
			// its Math.random fallback; this just lets third-party callers succeed.)
			(function() {
				try {
					if (window.crypto && typeof crypto.getRandomValues === 'function'
						&& typeof crypto.randomUUID !== 'function') {
						crypto.randomUUID = function() {
							var b = crypto.getRandomValues(new Uint8Array(16));
							b[6] = (b[6] & 0x0f) | 0x40;
							b[8] = (b[8] & 0x3f) | 0x80;
							var h = [];
							for (var i = 0; i < 16; i++) h.push((b[i] + 0x100).toString(16).slice(1));
							return h[0]+h[1]+h[2]+h[3]+'-'+h[4]+h[5]+'-'+h[6]+h[7]+'-'
								+h[8]+h[9]+'-'+h[10]+h[11]+h[12]+h[13]+h[14]+h[15];
						};
					}
				} catch (e) {}
			})();
		</script>
		<!--
			Boot loader: baked into the static shell so it paints on the first byte,
			before the JS bundle (Svelte + pdf-lib) and app.css load. Self-contained
			styles + colors (app.css isn't available yet); theme keys off the .dark
			class the script above sets pre-paint. Removed by +layout.svelte onMount.
		-->
		<style id="boot-style">
			#boot-loader {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f3f6f4;
				color: #15803d;
				transition: opacity 0.4s ease;
			}
			html.dark #boot-loader { background: #06120b; color: #4ade80; }
			#boot-loader.is-done { opacity: 0; pointer-events: none; }
			.boot-orb {
				position: relative;
				display: grid;
				place-items: center;
				width: 104px;
				height: 104px;
			}
			.boot-orb::before {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: 50%;
				background: radial-gradient(circle, currentColor 0%, transparent 68%);
				opacity: 0.12;
				filter: blur(6px);
				animation: boot-glow 2.4s ease-in-out infinite;
			}
			.boot-mark {
				position: relative;
				animation: boot-breathe 2.4s ease-in-out infinite;
			}
			.boot-page { fill: currentColor; opacity: 0.07; }
			.boot-ink {
				fill: none;
				stroke: currentColor;
				stroke-width: 1.6;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			.boot-scan {
				fill: url(#boot-beam);
				animation: boot-scan 1.55s cubic-bezier(0.45, 0, 0.55, 1) infinite;
			}
			@keyframes boot-scan {
				0%   { y: -7px; }
				72%  { y: 23px; }
				100% { y: 23px; }
			}
			@keyframes boot-breathe {
				0%, 100% { opacity: 0.88; transform: scale(0.97); }
				50%      { opacity: 1;    transform: scale(1.01); }
			}
			@keyframes boot-glow {
				0%, 100% { opacity: 0.08; transform: scale(0.92); }
				50%      { opacity: 0.18; transform: scale(1.04); }
			}
			@media (prefers-reduced-motion: reduce) {
				.boot-orb::before, .boot-mark { animation: none; }
				.boot-scan { animation: none; y: 9px; }
			}
		</style>
		<!-- JS-off: the boot loader's removal failsafe is itself JS, so without
		     this the user is trapped behind a permanent spinner. Hide it and let
		     the <noscript> panel below explain. -->
		<noscript>
			<style>#boot-loader { display: none !important; }</style>
		</noscript>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<div style="position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#f3f6f4;color:#0f1f17;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
				<div style="max-width:30rem;text-align:center;">
					<h1 style="margin:0 0 0.75rem;font-size:1.25rem;font-weight:700;color:#15803d;">JavaScript is required</h1>
					<p style="margin:0;font-size:0.95rem;line-height:1.55;">KeMeK PDF Lab does all its work <strong>inside your browser</strong> — which is exactly why it needs JavaScript. Enable it and reload to merge, split, rotate and edit your PDFs locally, with nothing uploaded.</p>
				</div>
			</div>
		</noscript>
		<div id="boot-loader" aria-hidden="true">
			<div class="boot-orb">
				<svg class="boot-mark" width="60" height="60" viewBox="0 0 24 24">
					<defs>
						<linearGradient id="boot-beam" x1="0" y1="0" x2="0" y2="1">
							<stop offset="0" stop-color="currentColor" stop-opacity="0" />
							<stop offset="0.5" stop-color="currentColor" stop-opacity="0.85" />
							<stop offset="1" stop-color="currentColor" stop-opacity="0" />
						</linearGradient>
						<clipPath id="boot-doc">
							<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
						</clipPath>
					</defs>
					<path class="boot-page" d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
					<g clip-path="url(#boot-doc)">
						<rect class="boot-scan" x="0" width="24" height="7" />
					</g>
					<g class="boot-ink">
						<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
						<polyline points="14 2 14 8 20 8" />
						<line x1="9" y1="13" x2="15" y2="13" />
						<line x1="9" y1="17" x2="13" y2="17" />
					</g>
				</svg>
			</div>
		</div>
		<script>
			// Failsafe: +layout.svelte's onMount removes the loader on the happy
			// path (~1s). If hydration throws before that ever runs, this clears
			// the loader anyway so the user isn't trapped behind a permanent
			// spinner — the prerendered shell becomes visible instead. The ceiling
			// is far above normal load, so it never fires on a healthy boot.
			setTimeout(function () {
				var el = document.getElementById('boot-loader');
				if (el) {
					el.classList.add('is-done');
					setTimeout(function () { el.remove(); }, 450);
				}
			}, 10000);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
