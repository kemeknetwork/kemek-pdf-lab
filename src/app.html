<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#15803d" />
		<meta name="description" content="Privacy-first PDF manipulation tool — merge, split, reorder, rotate. Runs entirely in your browser." />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		%sveltekit.head%
		<script>
			(function() {
				var t = localStorage.getItem('pdf-lab-theme');
				var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) {
					document.documentElement.classList.add('dark');
					document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#06120b');
				}
			})();
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
